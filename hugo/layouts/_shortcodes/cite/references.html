<details id="references">
  <summary class="big-summary">References</summary>

  {{ with .Page.Scratch.Get "references" }}
  <table>
    <tbody>
      {{ range . }}
      <tr id="ref-{{ .idx }}">
        <td><a href="#cite-{{ .idx }}">[{{ .idx }}]</a></td>
        <td>-</td>
        <td><a href="{{ .ref }}">{{ .ref }}</a></td>
      </tr>
      {{ end }}
    </tbody>
  </table>
  {{ end }}
</details>
